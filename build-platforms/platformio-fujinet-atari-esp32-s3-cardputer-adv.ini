[fujinet]
build_platform = BUILD_ATARI
build_bus      = SIO
build_board    = fujinet-atari-esp32-s3-cardputer-adv

[env:fujinet-atari-esp32-s3-cardputer-adv]
platform = espressif32@${fujinet.esp32_platform_version}
platform_packages = ${fujinet.esp32_platform_packages}
board = m5stack-cardputer-adv
build_type = debug
build_flags =
    ${env.build_flags}
    -D PINMAP_CARDPUTER_ADV
board_build.partitions = fujinet_partitions_8MB.csv
